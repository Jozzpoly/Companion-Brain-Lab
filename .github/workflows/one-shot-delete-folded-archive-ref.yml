name: one-shot-delete-folded-archive-ref

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Delete archive ref only after ancestry proof
        shell: bash
        run: |
          set -euo pipefail
          archive="archive/pre-cleanup-2026-09-20"
          git fetch origin "$archive"
          archive_sha="$(git rev-parse FETCH_HEAD)"
          main_sha="$(git rev-parse HEAD)"
          git merge-base --is-ancestor "$archive_sha" "$main_sha" || {
            echo "::error::Archive is not an ancestor of current main; refusing delete."
            exit 1
          }
          git push origin --delete "$archive"
          mapfile -t remaining < <(git ls-remote --heads origin | awk '{sub("refs/heads/","",$2); print $2}' | sort)
          printf 'Remaining branches:\n'
          printf ' - %s\n' "${remaining[@]}"
          (( ${#remaining[@]} == 1 )) && [[ "${remaining[0]}" == "main" ]]
