name: one-shot-retire-nov2026-branches
# Archive exact source in tags before closing draft PRs and removing branch refs.
# This workflow will be removed from main after successful execution.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-retire-nov2026-branches.yml"
permissions:
  contents: write
  pull-requests: write
jobs:
  retire-only-three-exact-refs:
    if: github.repository == 'Jozzpoly/Companion-Brain-Lab' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Archive each exact source to a verified immutable tag
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          refs=(
            'experiment/gpt6-companion-lived-moment-2026-11-06|36e886abbacbebda95d0f13ceee5f4da3100e0e2|archive/2026-11-10/jaskinia-lived-moment'
            'experiment/gpt6-companion-live-cover-2026-11-07|7f6a0c6cbad79c732b32d87a0124f70ae6e26953|archive/2026-11-10/companion-live-cover'
            'preview/gpt6-companion-live-cover-2026-11-07|2c24ff8940e905326c6d1f38c8c797af4e02733b|archive/2026-11-10/cover-compiled-preview'
          )
          for row in ""${refs[@]}""; do
            IFS='|' read -r branch sha tag <<< "$row"
            remote="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            if [ "$remote" != "$sha" ]; then
              echo "::error::Source branch changed: $branch; abort before any deletion"
              exit 1
            fi
          done
          for row in ""${refs[@]}""; do
            IFS='|' read -r branch sha tag <<< "$row"
            if existing="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null)"; then
              test "$existing" = "$sha"
            else
              gh api --method POST "repos/$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
            fi
            test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')" = "$sha"
            echo "ARCHIVED $branch -> $tag ($sha)"
          done
      - name: Retarget stacked PR and close both obsolete research PRs
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          for n in 65 66; do
            test "$(gh api "repos/$repo/pulls/$n" --jq '.state')" = open
          done
          gh api --method PATCH "repos/$repo/pulls/66" -f base=main >/dev/null
          gh api --method PATCH "repos/$repo/pulls/66" -f state=closed >/dev/null
          gh api --method PATCH "repos/$repo/pulls/65" -f state=closed >/dev/null
          for n in 65 66; do
            test "$(gh api "repos/$repo/pulls/$n" --jq '.state')" = closed
            echo "CLOSED DONOR PR #$n (not merged)"
          done
      - name: Delete only exact archived and reverified branch heads
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          refs=(
            'experiment/gpt6-companion-lived-moment-2026-11-06|36e886abbacbebda95d0f13ceee5f4da3100e0e2|archive/2026-11-10/jaskinia-lived-moment'
            'experiment/gpt6-companion-live-cover-2026-11-07|7f6a0c6cbad79c732b32d87a0124f70ae6e26953|archive/2026-11-10/companion-live-cover'
            'preview/gpt6-companion-live-cover-2026-11-07|2c24ff8940e905326c6d1f38c8c797af4e02733b|archive/2026-11-10/cover-compiled-preview'
          )
          for row in ""${refs[@]}""; do
            IFS='|' read -r branch sha tag <<< "$row"
            case "$branch" in
              experiment/gpt6-companion-lived-moment-2026-11-06|experiment/gpt6-companion-live-cover-2026-11-07|preview/gpt6-companion-live-cover-2026-11-07) ;;
              *) echo "::error::Unauthorized branch $branch"; exit 1 ;;
            esac
            test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')" = "$sha"
            test "$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')" = "$sha"
            gh api --method DELETE "repos/$repo/git/refs/heads/$branch" >/dev/null
            echo "RETIRED $branch; recover from tag $tag"
          done
          test "$(gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')" != ""
          echo "FINISHED: main retained, donor source and preview preserved as archive tags."