name: companion-jaskinia-lived-browser

# The PR's three-dot diff keeps historical code files in scope even on
# docs-only commits. For this isolated donor branch use a two-dot PUSH diff:
# source changes trigger the browser, documentation does not.
on:
  push:
    branches:
      - experiment/gpt6-companion-live-cover-2026-11-07
    paths:
      - "src/bridge/companion-jaskinia-lived-moment.ts"
      - "src/bridge/companion-jaskinia-lived-moment.test.ts"
      - "src/app/squad-field-lab-scene.ts"
      - "scripts/companion-jaskinia-lived-browser.mjs"
      - "scripts/companion-cover-physical-browser.mjs"
      - "src/brain/companion-cover-probe.ts"
      - "src/brain/companion-cover-probe.test.ts"
      - "src/app/squad-field-lab-hud.ts"
      - ".github/workflows/companion-jaskinia-lived-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

# Repeated research commits previously left dozens of obsolete cross-repo
# browser runs in flight. Only the latest revision of this PR is useful.
concurrency:
  group: companion-browser-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  real-jaskinia-contact:
    runs-on: ubuntu-latest
    env:
      VITE_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Companion and build its genuine current Field Lab
        run: |
          if ! npm install; then
            echo "npm Arborist fallback permitted only for known previous issue"
            npm install --legacy-peer-deps
          fi
          # The separate validate workflow is responsible for tsc + Vitest.
          # This job builds exactly what its real Chrome cross-repo tests execute.
          npm run build
      - name: Check out pinned genuine old Jaskinia as disposable browser fixture
        uses: actions/checkout@v5
        with:
          repository: Jozzpoly/Jozz-Cave-Workbench
          ref: 7fcedfa6db94cf6ad871000018dc555269615c9a
          path: .rehearsal/old-jaskinia
      - name: Build old Jaskinia's actual native-window runtime
        run: |
          cd .rehearsal/old-jaskinia
          npm ci --ignore-scripts --omit=optional
          mkdir -p ../../dist/Jozz-Cave-Workbench
          python3 tools/render.py --app jaskinia --host web --out ../../dist/Jozz-Cave-Workbench/index.html
      - name: Same-origin real browser experiment — Jaskinia + Field Lab + Owner note
        run: node scripts/companion-jaskinia-lived-browser.mjs
      - name: 'Live authority contrast: real Combat Micro player-hit vs opt-in C1 responsibility'
        run: node scripts/companion-cover-physical-browser.mjs
      - name: Preserve browser visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: companion-jaskinia-lived-${{ github.sha }}
          path: |
            artifacts/companion-jaskinia-lived-browser/
            artifacts/companion-cover-physical-browser/
          if-no-files-found: warn
          retention-days: 14
