name: cooperative-episode-browser

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cooperative-episode-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      VITE_SOURCE_SHA: ${{ github.sha }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install from repository lockfile
        run: npm ci --no-audit --no-fund
      - name: Full compile and unit/build gate
        run: npm run check
      - name: Continuous manual cooperative episode browser gate
        run: npm run browser:cooperative-episode
      - name: Manual gold-standard choreography red-team
        run: npm run browser:cooperative-episode-choreography
      - name: Upload cooperative episode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cooperative-episode-browser-${{ github.sha }}
          path: |
            artifacts/cooperative-episode-browser/
            artifacts/cooperative-episode-choreography/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish cooperative-episode-browser commit status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" != "success" ]; then state="failure"; fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"'"$state"'","context":"cooperative-episode-browser","description":"continuous manual episode '"$state"'","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
