name: s1-shared-danger-browser

on:
  workflow_dispatch:

concurrency:
  group: s1-shared-danger-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      VITE_SOURCE_SHA: ${{ github.sha }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install from repository lockfile
        run: npm ci --no-audit --no-fund
      - name: Build ordinary runtime
        run: npm run build
      - name: S1 shared-danger browser gate
        run: npm run browser:s1-apparatus
      - name: Upload S1 participant-first evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-shared-danger-browser-${{ github.sha }}
          path: artifacts/s1-shared-danger-browser/
          if-no-files-found: warn
          retention-days: 14
