name: one-shot-structural-audit
# Read-only source/import graph and real bundler graph audit.
# Remove this workflow after exporting findings into durable state.
on:
  push:
    branches: [main]
    paths: [".github/workflows/one-shot-structural-audit.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install exact repo dependencies
        run: npm ci --no-audit --no-fund
      - name: Build with one-off source map (not published)
        run: npm run build -- --sourcemap
      - name: Trace runtime imports and actual Vite bundle module coverage
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          // Deliberately use a conservative import-text scanner as an upper bound.
          // Actual Vite source-map membership below is the definitive build inclusion proof.
          function walk(d) {
            return fs.readdirSync(d, {withFileTypes:true}).flatMap(e => {
              const p=path.posix.join(d,e.name);
              return e.isDirectory()?walk(p):[p];
            });
          }
          const all=walk("src").filter(x=>x.endsWith(".ts"));
          const prod=all.filter(x=>!x.endsWith(".test.ts"));
          const tests=all.filter(x=>x.endsWith(".test.ts"));
          const allSet=new Set(all);
          function resolve(from,spec) {
            if(!spec.startsWith("."))return null;
            const base=path.posix.normalize(path.posix.join(path.posix.dirname(from),spec));
            const candidates=[base,base+".ts",base+"/index.ts",base.replace(/\.js$/, ".ts")];
            return candidates.find(x=>allSet.has(x))||null;
          }
          function readEdges(p) {
            const code=fs.readFileSync(p,"utf8");
            const found=[],dynamic=[];
            for(const re of [
              /\bfrom\s*["'](\.[^"']+)["']/g,
              /\bimport\s*["'](\.[^"']+)["']/g
            ]) {
              for(const m of code.matchAll(re)) {
                const target=resolve(p,m[1]);
                if(target)found.push(target);
              }
            }
            for(const m of code.matchAll(/\bimport\s*\(\s*["'](\.[^"']+)["']\s*\)/g)) {
              const target=resolve(p,m[1]);
              if(target){found.push(target);dynamic.push(target);}
            }
            const all=[...new Set(found)];
            return {runtime:all,all,dynamic:[...new Set(dynamic)]};
          }
          const edges=new Map(all.map(p=>[p,readEdges(p)]));
          const seen=new Set(),q=["src/main.ts"];
          while(q.length) {
            const p=q.shift();
            if(seen.has(p))continue;
            seen.add(p);
            for(const n of edges.get(p)?.runtime||[])q.push(n);
          }
          const testsUsing={};
          for(const t of tests)for(const d of edges.get(t)?.all||[]) {
            (testsUsing[d]??=[]).push(t);
          }
          const groups={};
          for(const p of prod) {
            const g=p.split("/")[1];
            groups[g]??={production:0,reachableFromMain:0,notReachable:0};
            groups[g].production++;
            if(seen.has(p))groups[g].reachableFromMain++;
            else groups[g].notReachable++;
          }
          const dormant=prod.filter(p=>!seen.has(p)).map(p=>({path:p,testImporters:(testsUsing[p]||[]).length}));
          const maps=walk("dist").filter(p=>p.endsWith(".js.map"));
          const bundleModules=new Set(),bundleChunks=[];
          for(const mp of maps) {
            const map=JSON.parse(fs.readFileSync(mp,"utf8"));
            for(const p of map.sources||[]) {
              const marker=p.indexOf("src/");
              if(marker>=0)bundleModules.add(p.slice(marker));
            }
            const js=mp.slice(0,-4);
            bundleChunks.push({chunk:js,bytes:fs.statSync(js).size});
          }
          const observed={productionModules:prod.length,testModules:tests.length,sourceImportReachableUpperBound:seen.size,perFolder:groups,unreachableProduction:dormant,srcModulesInActualBuild:bundleModules.size,actualBuildSources:[...bundleModules].sort(),bundleChunks};
          console.log("STRUCTURAL_AUDIT_JSON_BEGIN");
          console.log(JSON.stringify(observed,null,2));
          console.log("STRUCTURAL_AUDIT_JSON_END");
          NODE