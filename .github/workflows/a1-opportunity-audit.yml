name: a1-opportunity-audit

on:
  push:
    branches:
      - experiment/a1-opportunity-persistence
    paths:
      - "src/coordination/a1-opportunity-*.audit.test.ts"
      - "src/coordination/a1-spatial-commitment-evidence.ts"
      - "src/coordination/a1-spatial-commitment-reference.ts"
      - "src/coordination/a1-spatial-commitment-review.ts"
      - "src/coordination/a1-spatial-commitment-deliberation.ts"
      - "src/coordination/a1-spatial-commitment-material.ts"
      - "src/coordination/a1-spatial-commitment-actor-occupancy.ts"
      - "src/coordination/a1-spatial-commitment-player-future-occupancy.ts"
      - "src/coordination/a1-spatial-commitment-player-future-set.ts"
      - "src/coordination/a1-spatial-commitment-direct-realization.ts"
      - "src/coordination/a1-spatial-commitment-joint-future.ts"
      - "src/coordination/a1-companion-candidates.ts"
      - "src/coordination/a1-direct-joint-physical-rehearsal.ts"
      - "src/coordination/a1-direct-static-qualification.ts"
      - "src/coordination/a1-player-future-hypotheses.ts"
      - "src/coordination/a1-player-future-interventions.ts"
      - "src/coordination/a1-player-future-rehearsal.ts"
      - "src/coordination/a1-situation.ts"
      - "src/coordination/a1-accessibility-fragments.ts"
      - "src/coordination/a1-relationship-orientation.ts"
      - "src/coordination/a1-relationship-projection.ts"
      - "src/coordination/a1-relationship-utility.ts"
      - "src/navigation/hard-route-truth.ts"
      - "src/navigation/static-router.ts"
      - ".github/workflows/a1-opportunity-audit.yml"
  workflow_dispatch:

concurrency:
  group: a1-opportunity-audit-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  opportunity-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Typecheck A1 opportunity surface
        run: npx tsc -p tsconfig.json --noEmit
      - name: Run A1 opportunity audits
        run: npx vitest run src/coordination/a1-opportunity-*.audit.test.ts --reporter=verbose
