name: combat-micro-browser

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: combat-micro-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      VITE_SOURCE_SHA: ${{ github.sha }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install from repository lockfile
        run: npm ci --no-audit --no-fund
      - name: Full compile unit and build gate
        run: npm run check
      - name: Manual combat responsibility browser falsifier
        run: npm run browser:combat-micro-manual
      - name: Strategy diversity falsifier
        run: npm run browser:combat-micro-strategies
      - name: Upload combat micro evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combat-micro-browser-${{ github.sha }}
          path: |
            artifacts/combat-micro-manual/
            artifacts/combat-micro-strategies/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish combat-micro-browser commit status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" != "success" ]; then state="failure"; fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"'"$state"'","context":"combat-micro-browser","description":"manual combat micro '"$state"'","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'
