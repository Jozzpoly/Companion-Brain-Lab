name: squad-field-lab-browser

on:
  push:
    branches:
      - main
    paths:
      - "src/world/types.ts"
      - "src/world/scenarios.ts"
      - "src/world/world.ts"
      - "src/world/cooperative-episode-contract.ts"
      - "src/world/cooperative-episode-contract.test.ts"
      - "src/world/combat-micro-contract.ts"
      - "src/world/combat-micro-contract.test.ts"
      - "src/world/squad-field-lab.test.ts"
      - "src/physics/rapier-physical-world.ts"
      - "src/squad/field-lab-squad-control.ts"
      - "src/squad/field-lab-squad-control.test.ts"
      - "src/squad/field-lab-experiment.ts"
      - "src/squad/field-lab-experiment.test.ts"
      - "src/squad/field-lab-trial.ts"
      - "src/squad/field-lab-trial.test.ts"
      - "src/app/squad-field-lab-scene.ts"
      - "src/app/squad-field-lab-hud.ts"
      - "src/debug/squad-field-lab-panel.ts"
      - "src/main.ts"
      - "index.html"
      - "scripts/squad-field-lab-browser-smoke.mjs"
      - "scripts/squad-field-lab-experiment-browser-smoke.mjs"
      - "scripts/squad-field-lab-manual-episode-authoring.mjs"
      - "scripts/squad-field-lab-combat-authoring.mjs"
      - "scripts/squad-field-lab-responsibility-patterns.mjs"
      - "scripts/squad-field-lab-reverse-takeover.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/squad-field-lab-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: squad-field-lab-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      VITE_SOURCE_SHA: ${{ github.sha }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if npm install; then
            exit 0
          fi
          latest_log="$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1 || true)"
          if [ -z "$latest_log" ] || ! grep -Fq "Cannot read properties of null (reading 'edgesOut')" "$latest_log"; then
            if [ -n "$latest_log" ]; then cat "$latest_log"; fi
            exit 1
          fi
          rm -rf node_modules
          npm install --legacy-peer-deps
      - name: Full compile unit and build gate
        run: npm run check
      - name: Broad Squad Field Lab browser rehearsal
        run: npm run browser:squad-field-lab
      - name: Persistent A-B experiment rehearsal
        run: npm run browser:squad-field-lab-experiments
      # Historical doorway discovery and rejected task-pressure campaigns remain
      # reproducible from package scripts, but are not routine per-push gates.
      - name: Active one-companion combat authoring falsifier
        run: npm run browser:squad-field-lab-combat-authoring
      - name: Multi-beat responsibility pattern falsifier
        run: npm run browser:squad-field-lab-responsibility-patterns
      - name: Reverse responsibility takeover falsifier
        run: npm run browser:squad-field-lab-reverse-takeover
      - name: Durable manual action/order provenance regression
        run: npm run browser:squad-field-lab-manual-episode
      - name: Upload Field Lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squad-field-lab-browser-${{ github.sha }}
          path: |
            artifacts/squad-field-lab-browser/
            artifacts/squad-field-lab-experiment-browser/
            artifacts/squad-field-lab-manual-episode-authoring/
            artifacts/squad-field-lab-combat-authoring/
            artifacts/squad-field-lab-responsibility-patterns/
            artifacts/squad-field-lab-reverse-takeover/
          if-no-files-found: warn
          retention-days: 14
