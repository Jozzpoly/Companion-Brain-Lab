name: squad-field-lab-browser

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: squad-field-lab-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      VITE_SOURCE_SHA: ${{ github.sha }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if npm install; then
            exit 0
          fi
          latest_log="$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1 || true)"
          if [ -z "$latest_log" ] || ! grep -Fq "Cannot read properties of null (reading 'edgesOut')" "$latest_log"; then
            if [ -n "$latest_log" ]; then cat "$latest_log"; fi
            exit 1
          fi
          rm -rf node_modules
          npm install --legacy-peer-deps
      - name: Full compile unit and build gate
        run: npm run check
      - name: Broad Squad Field Lab browser rehearsal
        run: npm run browser:squad-field-lab
      - name: Persistent A-B experiment rehearsal
        run: npm run browser:squad-field-lab-experiments
      # Historical doorway, rejected task-pressure, and now-qualified manual
      # takeover campaigns remain reproducible from package scripts, but are
      # not routine per-push gates.
      - name: Active one-companion combat authoring falsifier
        run: npm run browser:squad-field-lab-combat-authoring
      - name: Zero-authority takeover shadow falsifier
        run: npm run browser:squad-field-lab-takeover-shadow
      - name: Takeover shadow counterfactual matrix
        run: npm run browser:squad-field-lab-takeover-shadow-matrix
      - name: Temporal takeover shadow trace falsifier
        run: npm run browser:squad-field-lab-takeover-shadow-trace
      - name: Preparation semantics falsifier
        run: npm run browser:squad-field-lab-preparation-semantics
      - name: Readiness display-slack boundary falsifier
        run: npm run browser:squad-field-lab-readiness-boundary
      - name: Durable manual action/order provenance regression
        run: npm run browser:squad-field-lab-manual-episode
      - name: Upload Field Lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: squad-field-lab-browser-${{ github.sha }}
          path: |
            artifacts/squad-field-lab-browser/
            artifacts/squad-field-lab-experiment-browser/
            artifacts/squad-field-lab-manual-episode-authoring/
            artifacts/squad-field-lab-combat-authoring/
            artifacts/squad-field-lab-takeover-shadow/
            artifacts/squad-field-lab-takeover-shadow-matrix/
            artifacts/squad-field-lab-takeover-shadow-trace/
            artifacts/squad-field-lab-preparation-semantics/
            artifacts/squad-field-lab-readiness-boundary/
          if-no-files-found: warn
          retention-days: 14
