name: deploy-pinned-research-preview

# Operational Pages authority lives on main and remains explicitly pinned.
# Root publishes the exact Owner-qualified Foundation runtime.
# /ccc0/ publishes a separate exact shadow-research checkpoint with ZERO movement authority.
# This composite artifact preserves the historical Foundation preview while allowing Owner observation of CCC-0.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-research-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-research-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Foundation Owner-qualified runtime
        uses: actions/checkout@v5
        with:
          ref: b217943e027e66993f0010643b2933b01d4b1e6d
          path: foundation

      - name: Checkout exact CCC-0 shadow checkpoint
        uses: actions/checkout@v5
        with:
          ref: bfe30df9298c1aa36dd4db43de70a049804255bc
          path: ccc0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Foundation dependencies
        working-directory: foundation
        run: npm install

      - name: Validate exact Foundation source
        working-directory: foundation
        run: npm run check

      - name: Install CCC-0 dependencies
        working-directory: ccc0
        run: npm install

      - name: Validate exact CCC-0 source
        working-directory: ccc0
        run: npm run check

      - name: Assemble composite Pages artifact
        run: |
          mkdir -p site/ccc0
          cp -R foundation/dist/. site/
          cp -R ccc0/dist/. site/ccc0/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload composite Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy pinned Foundation root + CCC-0 shadow subpath
        id: deployment
        uses: actions/deploy-pages@v5
