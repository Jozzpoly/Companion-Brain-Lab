name: deploy-pinned-research-preview

# Operational Pages authority lives on main and remains explicitly pinned.
# Root preserves the exact historical Foundation Owner-qualified runtime.
# /ccc0/ preserves the exact ZERO-authority CCC-0 shadow checkpoint.
# /owner/ publishes the separately qualified OS-PREP-5 Owner Sandbox candidate.
# Each surface is built from an immutable source SHA; the Owner build additionally
# embeds that exact SHA into downloadable incident provenance.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-research-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-research-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Foundation Owner-qualified runtime
        uses: actions/checkout@v5
        with:
          ref: b217943e027e66993f0010643b2933b01d4b1e6d
          path: foundation

      - name: Checkout exact CCC-0 shadow checkpoint
        uses: actions/checkout@v5
        with:
          ref: 857620b758bdaafcbfbab48da06ff89e7fc238cd
          path: ccc0

      - name: Checkout exact OS-PREP-5 Owner Sandbox candidate
        uses: actions/checkout@v5
        with:
          ref: 437cd11727eba327b99d8d70c80ce031c003a040
          path: owner

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Foundation dependencies
        working-directory: foundation
        run: |
          if npm install; then
            echo "Dependency install completed through normal npm peer resolution."
            exit 0
          fi
          
          latest_log="$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1 || true)"
          if [ -z "$latest_log" ] || ! grep -Fq "Cannot read properties of null (reading 'edgesOut')" "$latest_log"; then
            echo "npm failed for an unrecognized reason; refusing fallback."
            if [ -n "$latest_log" ]; then cat "$latest_log"; fi
            exit 1
          fi
          
          echo "Known npm Arborist edgesOut crash detected; retrying with peer auto-resolution disabled."
          rm -rf node_modules
          npm install --legacy-peer-deps

      - name: Validate exact Foundation source
        working-directory: foundation
        run: npm run check

      - name: Install CCC-0 dependencies
        working-directory: ccc0
        run: |
          if npm install; then
            echo "Dependency install completed through normal npm peer resolution."
            exit 0
          fi
          
          latest_log="$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1 || true)"
          if [ -z "$latest_log" ] || ! grep -Fq "Cannot read properties of null (reading 'edgesOut')" "$latest_log"; then
            echo "npm failed for an unrecognized reason; refusing fallback."
            if [ -n "$latest_log" ]; then cat "$latest_log"; fi
            exit 1
          fi
          
          echo "Known npm Arborist edgesOut crash detected; retrying with peer auto-resolution disabled."
          rm -rf node_modules
          npm install --legacy-peer-deps

      - name: Validate exact CCC-0 source
        working-directory: ccc0
        run: npm run check

      - name: Install Owner Sandbox dependencies
        working-directory: owner
        run: |
          if npm install; then
            echo "Dependency install completed through normal npm peer resolution."
            exit 0
          fi
          
          latest_log="$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1 || true)"
          if [ -z "$latest_log" ] || ! grep -Fq "Cannot read properties of null (reading 'edgesOut')" "$latest_log"; then
            echo "npm failed for an unrecognized reason; refusing fallback."
            if [ -n "$latest_log" ]; then cat "$latest_log"; fi
            exit 1
          fi
          
          echo "Known npm Arborist edgesOut crash detected; retrying with peer auto-resolution disabled."
          rm -rf node_modules
          npm install --legacy-peer-deps

      - name: Validate and build exact Owner Sandbox source with pinned provenance
        working-directory: owner
        env:
          VITE_SOURCE_SHA: 437cd11727eba327b99d8d70c80ce031c003a040
        run: npm run check

      - name: Assemble composite Pages artifact
        run: |
          mkdir -p site/ccc0 site/owner
          cp -R foundation/dist/. site/
          cp -R ccc0/dist/. site/ccc0/
          cp -R owner/dist/. site/owner/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload composite Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy pinned Foundation + CCC-0 + Owner Sandbox surfaces
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      EXPECTED_OWNER_SHA: 437cd11727eba327b99d8d70c80ce031c003a040
      PAGE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Checkout exact Owner Sandbox candidate for smoke tooling
        uses: actions/checkout@v5
        with:
          ref: 437cd11727eba327b99d8d70c80ce031c003a040
          path: owner-smoke

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Owner Sandbox smoke dependencies
        working-directory: owner-smoke
        run: npm install

      - name: Verify public Owner Sandbox identity and participant boundary
        working-directory: owner-smoke
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from "node:fs/promises";
          import { chromium } from "playwright-chromium";

          const expected = process.env.EXPECTED_OWNER_SHA;
          const pageUrl = process.env.PAGE_URL;
          if (!expected || !pageUrl) throw new Error("Missing public smoke provenance inputs.");
          const ownerUrl = `${pageUrl.replace(/\/$/, "")}/owner/?owner=1`;

          const browser = await chromium.launch({ headless: true });
          let lastError = null;
          try {
            for (let attempt = 1; attempt <= 12; attempt += 1) {
              const context = await browser.newContext({
                viewport: { width: 1600, height: 1000 },
                acceptDownloads: true
              });
              const page = await context.newPage();
              try {
                const response = await page.goto(ownerUrl, {
                  waitUntil: "domcontentloaded",
                  timeout: 30_000
                });
                if (!response?.ok()) throw new Error(`HTTP ${response?.status() ?? "no-response"}`);

                await page.locator("#game-root canvas").waitFor({ state: "visible", timeout: 15_000 });
                const panel = page.locator("#debug-panel");
                await panel.waitFor({ state: "attached", timeout: 15_000 });

                if (!(await panel.evaluate((node) => node.classList.contains("is-owner-sandbox")))) {
                  throw new Error("Public page is not in Owner Sandbox mode.");
                }
                if (!(await panel.evaluate((node) => node.classList.contains("is-collapsed")))) {
                  throw new Error("Public Owner research panel is not collapsed.");
                }
                if (await page.evaluate(() => window.__authorityA12p2BrowserBridge !== undefined)) {
                  throw new Error("Public ordinary Owner surface unexpectedly exposes P2.");
                }

                const wait = page.waitForEvent("download", { timeout: 15_000 });
                await page.locator(".owner-capture").click();
                const download = await wait;
                const downloadedPath = await download.path();
                if (!downloadedPath) throw new Error("Public Owner Save produced no download path.");
                const incident = JSON.parse(await readFile(downloadedPath, "utf8"));

                if (incident?.build?.sourceSha !== expected) {
                  throw new Error(
                    `Public Owner SHA mismatch: expected ${expected}, got ${incident?.build?.sourceSha ?? "missing"}`
                  );
                }
                if (incident?.build?.state !== "PINNED_SOURCE_SHA") {
                  throw new Error(`Public Owner build state is ${incident?.build?.state ?? "missing"}.`);
                }
                if (incident?.capture?.mode !== "spatial" || incident?.capture?.actuator !== "natural") {
                  throw new Error("Public Owner baseline is not SPATIAL/NATURAL.");
                }
                if (incident?.capture?.a1Variant !== "off" || incident?.p2?.available !== false) {
                  throw new Error("Public Owner authority boundary is wider than intended.");
                }

                console.log(JSON.stringify({
                  status: "PASS",
                  ownerUrl,
                  sourceSha: incident.build.sourceSha,
                  buildState: incident.build.state,
                  baseline: {
                    mode: incident.capture.mode,
                    actuator: incident.capture.actuator,
                    a1Variant: incident.capture.a1Variant,
                    p2Available: incident.p2.available
                  },
                  attempt
                }));
                await context.close();
                lastError = null;
                break;
              } catch (error) {
                lastError = error;
                await context.close();
                if (attempt < 12) await new Promise((resolve) => setTimeout(resolve, 5_000));
              }
            }
          } finally {
            await browser.close();
          }
          if (lastError) throw lastError;
          NODE
