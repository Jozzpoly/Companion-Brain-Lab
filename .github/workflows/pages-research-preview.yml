name: deploy-pinned-research-preview

# Operational Pages authority lives on main; application source is explicitly pinned to a qualified experiment SHA.
# The published application below is the exact post-qualification-audited R1-4 Robustness Workbench runtime.
# Previous pre-audit R1-4 runtime remains recoverable at d3ec785ec7d12b5584cfd0e30e17bd496a5d639d.
# Previous R1-1 browser-gate runtime remains recoverable at 9a72c2237e859d838c183d23d1fc96f475867a45.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-research-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-research-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audited R1-4 browser-gate runtime
        uses: actions/checkout@v4
        with:
          ref: 8f08761cdfde3f0b5d3e595f4bb844d106104ed4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate exact audited R1-4 source
        run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy exact audited R1-4 artifact
        id: deployment
        uses: actions/deploy-pages@v4
