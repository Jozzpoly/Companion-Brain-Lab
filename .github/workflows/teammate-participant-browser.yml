name: teammate-participant-browser

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: teammate-participant-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      VITE_SOURCE_SHA: ${{ github.sha }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install from repository lockfile
        run: npm ci --no-audit --no-fund
      - name: Causal regression subset
        run: npx vitest run src/brain/situated-responsibility.test.ts src/brain/s3-material-contribution.test.ts src/brain/s4-correction.test.ts
      - name: Build ordinary runtime
        run: npm run build
      - name: Participant teammate browser gate
        run: npm run browser:teammate-participant
      - name: Upload participant evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teammate-participant-browser-${{ github.sha }}
          path: artifacts/teammate-participant-browser/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish teammate-participant-browser commit status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" != "success" ]; then state="failure"; fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"'"$state"'","context":"teammate-participant-browser","description":"integrated teammate participant '"$state"'","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

