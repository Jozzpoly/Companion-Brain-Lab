name: validate

on:
  push:
    branches:
      - main
      - planning/initial-research-skeleton
      - "experiment/**"
      - "foundation/**"
  pull_request:

concurrency:
  group: validate-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if npm install; then
            exit 0
          fi
          latest_log="$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1 || true)"
          if [ -z "$latest_log" ] || ! grep -Fq "Cannot read properties of null (reading 'edgesOut')" "$latest_log"; then
            cat "$latest_log" || true
            exit 1
          fi
          rm -rf node_modules
          npm install --legacy-peer-deps
      - run: npm run build
      - name: Run targeted A1.2z4b specimen and preserve failure evidence
        run: |
          set +e
          npm run browser:audit:a1-2z4b 2>&1 | tee a1-2z4b-targeted-output.txt
          status=${PIPESTATUS[0]}
          echo "$status" > a1-2z4b-exit-status.txt
          exit 0
      - name: Upload A1.2z4b failure evidence
        uses: actions/upload-artifact@v4
        with:
          name: a1-2z4b-failure-evidence-${{ github.sha }}
          path: |
            a1-2z4b-targeted-output.txt
            a1-2z4b-exit-status.txt
            artifacts/a1-2z4b/
          if-no-files-found: warn
          retention-days: 1
      - name: Preserve targeted specimen exit status
        run: exit "$(cat a1-2z4b-exit-status.txt)"
