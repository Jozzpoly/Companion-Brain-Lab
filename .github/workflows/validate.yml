name: validate

on:
  push:
    branches:
      - main
      - planning/initial-research-skeleton
      - "experiment/**"
      - "foundation/**"
  pull_request:

concurrency:
  group: validate-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if npm install; then
            echo "Dependency install completed through normal npm peer resolution."
            exit 0
          fi

          latest_log="$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1 || true)"
          echo "::group::npm debug log"
          if [ -n "$latest_log" ]; then
            cat "$latest_log"
          else
            echo "npm failed without a discoverable debug log"
          fi
          echo "::endgroup::"

          if [ -z "$latest_log" ] || ! grep -Fq "Cannot read properties of null (reading 'edgesOut')" "$latest_log"; then
            echo "npm failed for a reason other than the known Arborist edgesOut null-dereference; refusing fallback."
            exit 1
          fi

          echo "Known npm Arborist edgesOut crash detected; retrying with peer auto-resolution disabled."
          rm -rf node_modules
          npm install --legacy-peer-deps
          echo "NPM_ARBORIST_EDGESOUT_FALLBACK_USED=1"
      - run: npm run check
      - name: Capture A1.2z4 semantic marker
        run: |
          npx vitest run src/coordination/a1-h1-primary-head-on-shadow.audit.test.ts --reporter=verbose 2>&1 | tee a1-2z4-targeted-output.txt
          grep -F "[A1_2Z4_H1_PRIMARY_HEAD_ON_SHADOW_AUDIT]" a1-2z4-targeted-output.txt > a1-2z4-semantic-marker.txt
          test -s a1-2z4-semantic-marker.txt
      - name: Upload A1.2z4 semantic marker
        uses: actions/upload-artifact@v4
        with:
          name: a1-2z4-semantic-marker-${{ github.sha }}
          path: a1-2z4-semantic-marker.txt
          if-no-files-found: error
          retention-days: 1
      - run: npm run browser:audit
