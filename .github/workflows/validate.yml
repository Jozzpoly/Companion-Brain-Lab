name: validate

on:
  push:
    branches:
      - main
      - planning/initial-research-skeleton
      - "experiment/**"
      - "foundation/**"
      - "evidence/**"
  pull_request:

concurrency:
  group: validate-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if npm install; then
            echo "Dependency install completed through normal npm peer resolution."
            exit 0
          fi

          latest_log="$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1 || true)"
          echo "::group::npm debug log"
          if [ -n "$latest_log" ]; then
            cat "$latest_log"
          else
            echo "npm failed without a discoverable debug log"
          fi
          echo "::endgroup::"

          if [ -z "$latest_log" ] || ! grep -Fq "Cannot read properties of null (reading 'edgesOut')" "$latest_log"; then
            echo "npm failed for a reason other than the known Arborist edgesOut null-dereference; refusing fallback."
            exit 1
          fi

          echo "Known npm Arborist edgesOut crash detected; retrying with peer auto-resolution disabled."
          rm -rf node_modules
          npm install --legacy-peer-deps
          echo "NPM_ARBORIST_EDGESOUT_FALLBACK_USED=1"
      - run: npm run check
      - name: Capture A1.2z3 visual evidence
        run: npm run browser:audit > /tmp/a1-2z3-visual.log
      - name: Decode A1.2z3 visual evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync('/tmp/a1-2z3-visual.log', 'utf8');
          const labels = ['participant-before', 'participant-contact', 'participant-after', 'research-end'];
          const chunks = new Map(labels.map((label) => [label, []]));
          for (const line of text.split(/\r?\n/)) {
            const match = line.match(/^\[A1_2Z3_IMAGE_CHUNK\] (\S+) (\d+) ([A-Za-z0-9+/=]+)$/);
            if (!match || !chunks.has(match[1])) continue;
            chunks.get(match[1])[Number(match[2])] = match[3];
          }
          fs.mkdirSync('a1-2z3-visual', { recursive: true });
          for (const label of labels) {
            const parts = chunks.get(label);
            if (!parts.length || parts.some((part) => typeof part !== 'string')) {
              throw new Error(`Missing or non-contiguous chunks for ${label}`);
            }
            const bytes = Buffer.from(parts.join(''), 'base64');
            if (bytes.length < 1000) throw new Error(`Decoded ${label} is unexpectedly small (${bytes.length} bytes)`);
            fs.writeFileSync(`a1-2z3-visual/${label}.jpg`, bytes);
            console.log(`${label}: ${bytes.length} bytes`);
          }
          NODE
      - name: Upload A1.2z3 visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: a1-2z3-visual-evidence
          path: a1-2z3-visual/*.jpg
          if-no-files-found: error
          retention-days: 1
