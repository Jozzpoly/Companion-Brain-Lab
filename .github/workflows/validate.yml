name: validate

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: validate-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VITE_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install from verified lockfile
        run: npm ci --no-audit --no-fund
      - name: Fast repository gate
        run: npm run check
