name: validate

on:
  push:
    branches:
      - main
      - planning/initial-research-skeleton
      - "experiment/**"
      - "foundation/**"
  pull_request:

concurrency:
  group: validate-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VITE_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if npm install; then
            echo "Dependency install completed through normal npm peer resolution."
            exit 0
          fi

          latest_log="$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1 || true)"
          echo "::group::npm debug log"
          if [ -n "$latest_log" ]; then
            cat "$latest_log"
          else
            echo "npm failed without a discoverable debug log"
          fi
          echo "::endgroup::"

          if [ -z "$latest_log" ] || ! grep -Fq "Cannot read properties of null (reading 'edgesOut')" "$latest_log"; then
            echo "npm failed for a reason other than the known Arborist edgesOut null-dereference; refusing fallback."
            exit 1
          fi

          echo "Known npm Arborist edgesOut crash detected; retrying with peer auto-resolution disabled."
          rm -rf node_modules
          npm install --legacy-peer-deps
          echo "NPM_ARBORIST_EDGESOUT_FALLBACK_USED=1"
      - run: npm run check
      - run: npm run browser:audit
      - name: Upload OS-PREP-1 Owner incident browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: os-prep1-owner-incident-${{ github.sha }}
          path: artifacts/os-prep1-incident
          if-no-files-found: error
          retention-days: 7
      - name: Capture OS-PREP-3 PH-04 head-on baseline Twins
        run: npm run browser:audit:os-prep3-ph04
      - name: Upload OS-PREP-3 PH-04 head-on baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-prep3-ph04-head-on-baseline-${{ github.sha }}
          path: artifacts/os-prep3-ph04-head-on-baseline
          if-no-files-found: error
          retention-days: 7
      - name: Capture OS-PREP-3 PH-04 late cross-front Twins
        run: npm run browser:audit:os-prep3-ph04-cross
      - name: Upload OS-PREP-3 PH-04 late cross-front evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-prep3-ph04-late-cross-front-${{ github.sha }}
          path: artifacts/os-prep3-ph04-late-cross-front
          if-no-files-found: error
          retention-days: 7
      - name: Capture OS-PREP-3 PH-01 open turn/reversal Twins
        run: npm run browser:audit:os-prep3-ph01
      - name: Upload OS-PREP-3 PH-01 open turn/reversal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-prep3-ph01-open-turn-reversal-${{ github.sha }}
          path: artifacts/os-prep3-ph01-open-turn-reversal
          if-no-files-found: error
          retention-days: 7
      - name: Capture OS-PREP-3 PH-01 mirrored turn/reversal Twins
        run: npm run browser:audit:os-prep3-ph01-mirror
      - name: Upload OS-PREP-3 PH-01 mirrored turn/reversal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-prep3-ph01-open-turn-reversal-mirror-${{ github.sha }}
          path: artifacts/os-prep3-ph01-open-turn-reversal-mirror
          if-no-files-found: error
          retention-days: 7
      - name: Capture OS-PREP-3 PH-03 slow-walk Twins
        run: npm run browser:audit:os-prep3-ph03
      - name: Upload OS-PREP-3 PH-03 slow-walk evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-prep3-ph03-slow-walk-${{ github.sha }}
          path: artifacts/os-prep3-ph03-slow-walk
          if-no-files-found: error
          retention-days: 7
      - name: Capture OS-PREP-3 PH-03 sustained slow-walk Twins
        run: npm run browser:audit:os-prep3-ph03-sustained
      - name: Upload OS-PREP-3 PH-03 sustained slow-walk evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-prep3-ph03-sustained-slow-walk-${{ github.sha }}
          path: artifacts/os-prep3-ph03-sustained-slow-walk
          if-no-files-found: error
          retention-days: 7
      - name: Capture live relationship semantic provenance replay
        run: |
          set -o pipefail
          mkdir -p artifacts/relationship-semantic-provenance-live
          node scripts/relationship-semantic-provenance-live-browser-probe.mjs 2>&1 | tee artifacts/relationship-semantic-provenance-live/run.log
      - name: Upload live relationship semantic provenance replay
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-semantic-provenance-live-${{ github.sha }}
          path: artifacts/relationship-semantic-provenance-live
          if-no-files-found: error
          retention-days: 7
      - name: Capture live relationship semantic expiry behavior
        run: |
          set -o pipefail
          mkdir -p artifacts/relationship-semantic-expiry-live
          node scripts/relationship-semantic-expiry-live-browser-probe.mjs 2>&1 | tee artifacts/relationship-semantic-expiry-live/run.log
      - name: Upload live relationship semantic expiry behavior
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-semantic-expiry-live-${{ github.sha }}
          path: artifacts/relationship-semantic-expiry-live
          if-no-files-found: error
          retention-days: 7
      - name: Capture live relationship post-expiry disturbance
        run: |
          set -o pipefail
          mkdir -p artifacts/relationship-semantic-post-expiry-disturbance-live
          node scripts/relationship-semantic-post-expiry-disturbance-browser-probe.mjs 2>&1 | tee artifacts/relationship-semantic-post-expiry-disturbance-live/run.log
      - name: Upload live relationship post-expiry disturbance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-semantic-post-expiry-disturbance-live-${{ github.sha }}
          path: artifacts/relationship-semantic-post-expiry-disturbance-live
          if-no-files-found: error
          retention-days: 7
      - name: Capture live relationship post-expiry twin shadow
        run: |
          set -o pipefail
          mkdir -p artifacts/relationship-semantic-post-expiry-twin-shadow-live
          node scripts/relationship-semantic-post-expiry-twin-shadow-browser-probe.mjs 2>&1 | tee artifacts/relationship-semantic-post-expiry-twin-shadow-live/run.log
      - name: Upload live relationship post-expiry twin shadow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-semantic-post-expiry-twin-shadow-live-${{ github.sha }}
          path: artifacts/relationship-semantic-post-expiry-twin-shadow-live
          if-no-files-found: error
          retention-days: 7
      - name: Upload A1.2p1 embodied shadow browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: a1-2p1-embodied-shadow-${{ github.sha }}
          path: artifacts/a1-2p1
          if-no-files-found: error
          retention-days: 7
      - name: Upload A1.2p2 manual DIRECT browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: a1-2p2-manual-direct-${{ github.sha }}
          path: artifacts/a1-2p2
          if-no-files-found: error
          retention-days: 7
      - name: Capture A1.2z4f tick-zero early live class map
        run: node scripts/authority-a1-2z4f-tick0-early-live-class-map.mjs
      - name: Upload A1.2z4f tick-zero early live class map
        uses: actions/upload-artifact@v4
        with:
          name: a1-2z4f-early-live-class-map-${{ github.sha }}
          path: artifacts/a1-2z4f-tick0-early-live-class-map.json
          if-no-files-found: error
          retention-days: 7
      - name: Capture A1.2z4g tick-7-8-9 stage attribution trace
        run: node scripts/authority-a1-2z4g-stage-attribution-trace.mjs
      - name: Canonicalize A1.2z4g H1 tangent semantic summary
        run: node scripts/authority-a1-2z4g-h1-semantic-summary.mjs
      - name: Upload A1.2z4g stage attribution evidence
        uses: actions/upload-artifact@v4
        with:
          name: a1-2z4g-stage-attribution-${{ github.sha }}
          path: |
            artifacts/a1-2z4g-stage-attribution-trace.json
            artifacts/a1-2z4g-h1-semantic-summary.json
          if-no-files-found: error
          retention-days: 7
