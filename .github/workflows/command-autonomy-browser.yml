name: command-autonomy-browser

on:
  workflow_dispatch:

concurrency:
  group: command-autonomy-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      VITE_SOURCE_SHA: ${{ github.sha }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install from repository lockfile
        run: npm ci --no-audit --no-fund
      - name: Build ordinary runtime
        run: npm run build
      - name: Command/autonomy browser gate
        run: npm run browser:command-autonomy
      - name: Upload command/autonomy browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-autonomy-browser-${{ github.sha }}
          path: artifacts/command-autonomy-browser/
          if-no-files-found: warn
          retention-days: 14
