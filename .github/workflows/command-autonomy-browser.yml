name: command-autonomy-browser

on:
  push:
    branches:
      - main
    paths:
      - "src/app/r1-lab-scene.ts"
      - "src/app/player-command-hud.ts"
      - "src/app/owner-review-mode.ts"
      - "src/debug/causal-panel.ts"
      - "index.html"
      - "src/brain/r1-workbench-spatial-stack.ts"
      - "src/brain/stage-b-partner.ts"
      - "src/brain/player-directive.ts"
      - "src/world/shared-pressure.ts"
      - "src/world/world.ts"
      - "src/debug/causal-frame-trace.ts"
      - "scripts/command-autonomy-browser-smoke.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/command-autonomy-browser.yml"
  workflow_dispatch:

concurrency:
  group: command-autonomy-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      VITE_SOURCE_SHA: ${{ github.sha }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if npm install; then
            exit 0
          fi
          latest_log="$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1 || true)"
          if [ -z "$latest_log" ] || ! grep -Fq "Cannot read properties of null (reading 'edgesOut')" "$latest_log"; then
            if [ -n "$latest_log" ]; then cat "$latest_log"; fi
            exit 1
          fi
          rm -rf node_modules
          npm install --legacy-peer-deps
      - name: Build ordinary runtime
        run: npm run build
      - name: Command/autonomy browser gate
        run: npm run browser:command-autonomy
      - name: Upload command/autonomy browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: command-autonomy-browser-${{ github.sha }}
          path: artifacts/command-autonomy-browser/
          if-no-files-found: warn
          retention-days: 14
