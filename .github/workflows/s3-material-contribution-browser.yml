name: s3-material-contribution-browser

on:
  workflow_dispatch:

concurrency:
  group: s3-material-contribution-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      VITE_SOURCE_SHA: ${{ github.sha }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install from repository lockfile
        run: npm ci --no-audit --no-fund
      - name: S2/S3 causal unit gate
        run: npx vitest run src/brain/situated-responsibility.test.ts src/brain/s3-material-contribution.test.ts
      - name: Build ordinary runtime
        run: npm run build
      - name: S3 material-contribution browser gate
        run: npm run browser:s3-contribution
      - name: Upload S3 causal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s3-material-contribution-browser-${{ github.sha }}
          path: artifacts/s3-material-contribution-browser/
          if-no-files-found: warn
          retention-days: 14
