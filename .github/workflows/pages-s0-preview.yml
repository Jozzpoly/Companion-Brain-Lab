name: deploy-pinned-s0-preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages-s0-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-s0-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact qualified S0 head
        uses: actions/checkout@v4
        with:
          ref: 0ee6450aea121a1c3d2c59fc2fceda37539ab9f6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate exact S0 source
        run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy exact S0 artifact
        id: deployment
        uses: actions/deploy-pages@v4
