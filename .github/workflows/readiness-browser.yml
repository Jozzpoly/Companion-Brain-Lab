name: readiness-browser

on:
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: readiness-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    env:
      VITE_SOURCE_SHA: ${{ github.sha }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if npm install; then
            exit 0
          fi
          latest_log="$(ls -t "$HOME"/.npm/_logs/*-debug-0.log 2>/dev/null | head -n 1 || true)"
          if [ -z "$latest_log" ] || ! grep -Fq "Cannot read properties of null (reading 'edgesOut')" "$latest_log"; then
            if [ -n "$latest_log" ]; then cat "$latest_log"; fi
            exit 1
          fi
          rm -rf node_modules
          npm install --legacy-peer-deps
      - name: Readiness and causal unit gate
        run: npx vitest run src/brain/shared-danger-readiness.test.ts src/brain/situated-responsibility.test.ts src/brain/s3-material-contribution.test.ts src/brain/s4-correction.test.ts
      - name: Build ordinary runtime
        run: npm run build
      - name: Pre-contact readiness browser gate
        run: npm run browser:readiness
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-browser-${{ github.sha }}
          path: artifacts/readiness-browser/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish readiness-browser commit status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [ "$state" != "success" ]; then state="failure"; fi
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{"state":"'"$state"'","context":"readiness-browser","description":"pre-contact readiness '"$state"'","target_url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}'

