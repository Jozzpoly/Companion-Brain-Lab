<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Companion Brain Lab — R1 Causal Workbench</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d1117;
        color: #e7e9ee;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1117; }
      button, input { font: inherit; }
      #lab-shell { display: flex; width: 100vw; height: 100vh; min-width: 0; min-height: 0; }
      #game-pane { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; display: grid; place-items: center; background: #111318; overflow: hidden; }
      #game-root { width: 100%; height: 100%; min-width: 0; min-height: 0; }
      #game-root canvas { display: block; }

      #debug-panel {
        position: relative;
        flex: 0 0 clamp(420px, 27vw, 520px);
        width: clamp(420px, 27vw, 520px);
        min-width: 0;
        border-left: 1px solid #30363d;
        background: #0d1117;
        overflow: hidden;
        transition: flex-basis 140ms ease, width 140ms ease;
      }
      #debug-panel.is-collapsed { flex-basis: 44px; width: 44px; }
      .debug-panel-header {
        min-height: 58px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
        align-items: center;
        padding: 9px 8px 9px 12px;
        border-bottom: 1px solid #30363d;
        background: #161b22;
      }
      .debug-heading { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .debug-heading strong { font-size: 14px; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .debug-subtitle { color: #8b949e; font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .debug-badge { padding: 4px 7px; border: 1px solid #30363d; border-radius: 999px; color: #c9d1d9; background: #21262d; font: 700 10px/1 ui-monospace, monospace; }
      .debug-badge[data-tone="success"] { border-color: #2ea043; color: #7ee787; background: rgba(46,160,67,.12); }
      .debug-badge[data-tone="warning"] { border-color: #9e6a03; color: #e3b341; background: rgba(187,128,9,.12); }
      .debug-badge[data-tone="danger"] { border-color: #da3633; color: #ff7b72; background: rgba(248,81,73,.12); }
      .debug-collapse { width: 30px; height: 32px; border: 1px solid #30363d; border-radius: 6px; background: #21262d; color: #c9d1d9; cursor: pointer; }
      .owner-capture { min-width: 42px; height: 32px; padding: 0 7px; }
      .owner-review-controls { display: none; }
      .player-command-hud { position:absolute; left:14px; bottom:14px; z-index:8; display:grid; gap:7px; min-width:320px; padding:10px; border:1px solid rgba(88,166,255,.42); border-radius:9px; background:rgba(13,17,23,.88); box-shadow:0 8px 24px rgba(0,0,0,.28); backdrop-filter:blur(5px); pointer-events:auto; }
      .player-command-hud[hidden] { display:none; }
      .player-command-heading { color:#e7e9ee; font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.04em; text-transform:uppercase; }
      .player-command-buttons { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
      .player-command-button { display:grid; grid-template-columns:auto 1fr; align-items:center; gap:6px; min-height:34px; padding:5px 7px; border:1px solid #30363d; border-radius:6px; background:#161b22; color:#9da7b3; cursor:pointer; font-size:10px; text-align:left; }
      .player-command-button:hover { background:#21262d; }
      .player-command-button.is-active { border-color:#58a6ff; color:#e7e9ee; background:rgba(56,139,253,.14); }
      .player-command-button kbd { min-width:24px; padding:3px 4px; border:1px solid #484f58; border-radius:4px; background:#0d1117; color:#c9d1d9; font:700 9px/1 ui-monospace,monospace; text-align:center; }
      .player-command-status { color:#8b949e; font:10px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .shared-danger-hud { position:absolute; left:14px; bottom:14px; z-index:9; display:grid; gap:7px; min-width:360px; padding:10px; border:1px solid rgba(255,123,114,.5); border-radius:9px; background:rgba(13,17,23,.9); box-shadow:0 8px 24px rgba(0,0,0,.3); backdrop-filter:blur(5px); pointer-events:auto; }
      .shared-danger-hud[hidden] { display:none; }
      .shared-danger-heading { color:#e7e9ee; font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.04em; text-transform:uppercase; }
      .shared-danger-hint,.shared-danger-state { color:#8b949e; font:10px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .shared-danger-actions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px; }
      .shared-danger-actions.is-teammate { grid-template-columns:1fr; }
      .shared-danger-action { display:grid; grid-template-columns:auto 1fr; align-items:center; gap:6px; min-height:34px; padding:5px 7px; border:1px solid #484f58; border-radius:6px; background:#161b22; color:#c9d1d9; cursor:pointer; font-size:10px; text-align:left; }
      .shared-danger-action[hidden] { display:none; }
      .shared-danger-action:hover { background:#21262d; }
      .shared-danger-action:disabled { opacity:.45; cursor:not-allowed; }
      .shared-danger-action kbd { min-width:38px; padding:3px 4px; border:1px solid #484f58; border-radius:4px; background:#0d1117; color:#c9d1d9; font:700 9px/1 ui-monospace,monospace; text-align:center; }
      .debug-apparatus-grid { margin-top:6px; }
      .debug-collapse:hover, .debug-button:hover { background: #30363d; }
      .debug-panel-content { height: calc(100vh - 58px); overflow-y: auto; overscroll-behavior: contain; padding: 10px; }
      .debug-section { border: 1px solid #21262d; border-radius: 8px; margin-bottom: 9px; background: #11161d; }
      .debug-section[data-tone="warning"] { border-color: rgba(187,128,9,.6); }
      .debug-section[data-tone="danger"] { border-color: rgba(248,81,73,.65); }
      .debug-section[data-tone="success"] { border-color: rgba(46,160,67,.55); }
      .debug-section h2, .debug-section summary { margin: 0; padding: 9px 10px; color: #c9d1d9; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
      .debug-section summary { cursor: pointer; user-select: none; }
      .debug-lines { border-top: 1px solid #21262d; padding: 8px 10px 10px; color: #9da7b3; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
      .debug-lines > div + div { margin-top: 3px; }
      .debug-controls { padding-bottom: 9px; }
      .debug-button-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 0 9px; }
      .debug-scenario-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 6px; }
      .debug-button { min-height: 32px; border: 1px solid #30363d; border-radius: 6px; padding: 5px 7px; background: #21262d; color: #c9d1d9; cursor: pointer; font-size: 11px; }
      .debug-layer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 8px; padding: 0 10px 10px; }
      .debug-layer-toggle { display: flex; align-items: center; gap: 7px; min-width: 0; color: #9da7b3; font-size: 11px; }
      .debug-layer-toggle input { accent-color: #58a6ff; }
      .debug-hint { padding: 9px 10px; color: #6e7681; font: 10px/1.45 ui-monospace, monospace; }

      #debug-panel.is-collapsed .debug-heading,
      #debug-panel.is-collapsed .debug-badge,
      #debug-panel.is-collapsed .debug-panel-content { display: none; }
      #debug-panel.is-collapsed .debug-panel-header { grid-template-columns: 1fr; padding: 9px 6px; }
      #debug-panel.is-collapsed .debug-collapse { width: 30px; justify-self: center; }
      #debug-panel.is-owner-sandbox.is-collapsed { flex-basis: 92px; width: 92px; }
      #debug-panel.is-owner-sandbox.is-collapsed .debug-panel-header {
        grid-template-columns: 1fr 34px;
        gap: 4px;
        padding: 9px 6px;
      }
      #debug-panel.is-owner-sandbox,
      #debug-panel.is-owner-sandbox.is-collapsed {
        flex-basis: 132px;
        width: 132px;
      }
      #debug-panel.is-owner-sandbox .debug-panel-header,
      #debug-panel.is-owner-sandbox .debug-panel-content {
        display: none;
      }
      #debug-panel.is-owner-sandbox .owner-review-controls {
        display: flex;
        height: 100%;
        flex-direction: column;
        gap: 10px;
        padding: 14px 10px;
        background: #0d1117;
        border-left: 1px solid #30363d;
      }
      .owner-review-title {
        font-size: 12px;
        line-height: 1.2;
        color: #e7e9ee;
      }
      .owner-review-hint {
        color: #8b949e;
        font: 10px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .owner-review-scenarios,
      .owner-review-actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .owner-review-actions {
        margin-top: auto;
      }
      #debug-panel.is-owner-sandbox .owner-review-controls .debug-button {
        width: 100%;
        min-height: 34px;
      }

      #debug-panel.is-teammate-sandbox,
      #debug-panel.is-teammate-sandbox.is-collapsed {
        flex-basis: 220px;
        width: 220px;
      }
      #debug-panel.is-teammate-sandbox .debug-panel-header,
      #debug-panel.is-teammate-sandbox .debug-panel-content {
        display: none;
      }
      #debug-panel.is-teammate-sandbox .owner-review-controls {
        display: flex;
        height: 100%;
        flex-direction: column;
        gap: 12px;
        padding: 16px 12px;
        background: #0d1117;
        border-left: 1px solid #30363d;
      }
      #debug-panel.is-teammate-sandbox .owner-review-controls .debug-button {
        width: 100%;
        min-height: 38px;
      }
      .squad-field-lab-hud {
        position:relative;
        flex:0 0 330px;
        width:330px;
        min-width:0;
        height:100vh;
        overflow-y:auto;
        z-index:12;
        display:grid;
        align-content:start;
        gap:8px;
        padding:12px;
        border-right:1px solid rgba(88,166,255,.38);
        background:#0d1117;
        pointer-events:auto;
      }
      .squad-lab-heading {
        color:#f0f6fc;
        font:800 13px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        letter-spacing:.035em;
        text-transform:uppercase;
      }
      .squad-lab-sub,.squad-lab-footer,.squad-lab-inline-hint {
        color:#8b949e;
        font:10px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      }
      .squad-lab-size-grid {
        display:grid;
        grid-template-columns:repeat(4,minmax(0,1fr));
        gap:5px;
      }
      .squad-lab-roster {
        display:grid;
        grid-template-columns:repeat(5,minmax(0,1fr));
        gap:5px;
      }
      .squad-lab-roster-button,.squad-lab-button {
        min-height:31px;
        border:1px solid #30363d;
        border-radius:6px;
        background:#161b22;
        color:#9da7b3;
        cursor:pointer;
        font:700 10px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      }
      .squad-lab-roster-button:hover,.squad-lab-button:hover { background:#21262d; }
      .squad-lab-roster-button:disabled {
        opacity:.28;
        cursor:not-allowed;
        background:#0d1117;
      }
      .squad-lab-roster-button.is-selected {
        border-color:#58a6ff;
        background:rgba(56,139,253,.14);
        color:#dcecff;
      }
      .squad-lab-roster-button.is-focused {
        box-shadow:0 0 0 2px rgba(255,255,255,.75) inset;
        color:#fff;
      }
      .squad-lab-button.is-active,
      .squad-lab-size-grid .squad-lab-button.is-active {
        border-color:#d2a8ff;
        color:#f4e7ff;
        background:rgba(163,113,247,.16);
      }
      .squad-lab-button-row {
        display:grid;
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:6px;
      }
      .squad-lab-preset-grid {
        display:grid;
        grid-template-columns:repeat(4,minmax(0,1fr));
        gap:5px;
      }
      .squad-lab-section-title {
        margin-top:2px;
        color:#c9d1d9;
        font:700 10px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        text-transform:uppercase;
        letter-spacing:.05em;
      }
      .squad-lab-slider {
        display:grid;
        grid-template-columns:86px 42px 1fr;
        align-items:center;
        gap:7px;
        color:#9da7b3;
        font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      }
      .squad-lab-slider input { width:100%; accent-color:#58a6ff; }
      .squad-lab-slider-value { color:#c9d1d9; text-align:right; }
      .squad-lab-status,.squad-lab-order-status {
        padding:6px 7px;
        border:1px solid #21262d;
        border-radius:6px;
        background:rgba(22,27,34,.7);
        color:#c9d1d9;
        font:10px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      }
      .squad-lab-order-status { color:#8b949e; }

      #debug-panel.squad-field-debug,
      #debug-panel.squad-field-debug.is-collapsed {
        flex-basis:clamp(360px,24vw,460px);
        width:clamp(360px,24vw,460px);
        background:#0d1117;
        border-left:1px solid #30363d;
      }
      #debug-panel.squad-field-debug.is-collapsed {
        flex-basis:44px;
        width:44px;
      }
      .squad-field-debug-header {
        min-height:58px;
        display:grid;
        grid-template-columns:minmax(0,1fr) 32px;
        gap:8px;
        align-items:center;
        padding:9px 8px 9px 12px;
        border-bottom:1px solid #30363d;
        background:#161b22;
      }
      .squad-field-debug-heading {
        min-width:0;
        display:flex;
        flex-direction:column;
        gap:2px;
      }
      .squad-field-debug-heading strong {
        color:#e7e9ee;
        font-size:13px;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
      }
      .squad-field-debug-heading span {
        color:#8b949e;
        font:10px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
      }
      .squad-field-debug-collapse {
        width:30px;
        height:32px;
        border:1px solid #30363d;
        border-radius:6px;
        background:#21262d;
        color:#c9d1d9;
        cursor:pointer;
      }
      .squad-field-debug-content {
        height:calc(100vh - 58px);
        overflow-y:auto;
        padding:10px;
      }
      .squad-field-debug-section {
        margin-bottom:9px;
        border:1px solid #21262d;
        border-radius:8px;
        background:#11161d;
      }
      .squad-field-debug-section.is-focus { border-color:rgba(88,166,255,.55); }
      .squad-field-debug-section h2 {
        margin:0;
        padding:8px 10px;
        border-bottom:1px solid #21262d;
        color:#c9d1d9;
        font-size:11px;
      }
      .squad-field-debug-lines {
        padding:8px 10px 10px;
        color:#9da7b3;
        font:10px/1.48 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        overflow-wrap:anywhere;
      }
      .squad-field-debug-lines > div + div { margin-top:3px; }
      .squad-field-debug-foot {
        color:#6e7681;
        font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
        padding:6px 2px 14px;
      }
      #debug-panel.squad-field-debug.is-collapsed .squad-field-debug-heading,
      #debug-panel.squad-field-debug.is-collapsed .squad-field-debug-content {
        display:none;
      }
      #debug-panel.squad-field-debug.is-collapsed .squad-field-debug-header {
        grid-template-columns:1fr;
        padding:9px 6px;
      }

      @media (max-width: 980px) {
        #debug-panel { flex-basis: min(46vw, 460px); width: min(46vw, 460px); }
      }
    </style>
  </head>
  <body>
    <div id="lab-shell">
      <main id="game-pane" aria-label="Companion Brain Lab world">
        <div id="game-root"></div>
      </main>
      <aside id="debug-panel" aria-label="Causal debug workbench"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
