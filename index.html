<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Companion Brain Lab — R1 Causal Workbench</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0d1117;
        color: #e7e9ee;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1117; }
      button, input { font: inherit; }
      #lab-shell { display: flex; width: 100vw; height: 100vh; min-width: 0; min-height: 0; }
      #game-pane { flex: 1 1 auto; min-width: 0; min-height: 0; display: grid; place-items: center; background: #111318; overflow: hidden; }
      #game-root { width: 100%; height: 100%; min-width: 0; min-height: 0; }
      #game-root canvas { display: block; }

      #debug-panel {
        position: relative;
        flex: 0 0 clamp(420px, 27vw, 520px);
        width: clamp(420px, 27vw, 520px);
        min-width: 0;
        border-left: 1px solid #30363d;
        background: #0d1117;
        overflow: hidden;
        transition: flex-basis 140ms ease, width 140ms ease;
      }
      #debug-panel.is-collapsed { flex-basis: 44px; width: 44px; }
      .debug-panel-header {
        min-height: 58px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto auto;
        gap: 8px;
        align-items: center;
        padding: 9px 8px 9px 12px;
        border-bottom: 1px solid #30363d;
        background: #161b22;
      }
      .debug-heading { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
      .debug-heading strong { font-size: 14px; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .debug-subtitle { color: #8b949e; font: 11px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .debug-badge { padding: 4px 7px; border: 1px solid #30363d; border-radius: 999px; color: #c9d1d9; background: #21262d; font: 700 10px/1 ui-monospace, monospace; }
      .debug-badge[data-tone="success"] { border-color: #2ea043; color: #7ee787; background: rgba(46,160,67,.12); }
      .debug-badge[data-tone="warning"] { border-color: #9e6a03; color: #e3b341; background: rgba(187,128,9,.12); }
      .debug-badge[data-tone="danger"] { border-color: #da3633; color: #ff7b72; background: rgba(248,81,73,.12); }
      .debug-collapse { width: 30px; height: 32px; border: 1px solid #30363d; border-radius: 6px; background: #21262d; color: #c9d1d9; cursor: pointer; }
      .owner-capture { min-width: 42px; height: 32px; padding: 0 7px; }
      .owner-review-controls { display: none; }
      .player-command-hud { position:absolute; left:14px; bottom:14px; z-index:8; display:grid; gap:7px; min-width:320px; padding:10px; border:1px solid rgba(88,166,255,.42); border-radius:9px; background:rgba(13,17,23,.88); box-shadow:0 8px 24px rgba(0,0,0,.28); backdrop-filter:blur(5px); pointer-events:auto; }
      .player-command-heading { color:#e7e9ee; font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.04em; text-transform:uppercase; }
      .player-command-buttons { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; }
      .player-command-button { display:grid; grid-template-columns:auto 1fr; align-items:center; gap:6px; min-height:34px; padding:5px 7px; border:1px solid #30363d; border-radius:6px; background:#161b22; color:#9da7b3; cursor:pointer; font-size:10px; text-align:left; }
      .player-command-button:hover { background:#21262d; }
      .player-command-button.is-active { border-color:#58a6ff; color:#e7e9ee; background:rgba(56,139,253,.14); }
      .player-command-button kbd { min-width:24px; padding:3px 4px; border:1px solid #484f58; border-radius:4px; background:#0d1117; color:#c9d1d9; font:700 9px/1 ui-monospace,monospace; text-align:center; }
      .player-command-status { color:#8b949e; font:10px/1.35 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
      .debug-collapse:hover, .debug-button:hover { background: #30363d; }
      .debug-panel-content { height: calc(100vh - 58px); overflow-y: auto; overscroll-behavior: contain; padding: 10px; }
      .debug-section { border: 1px solid #21262d; border-radius: 8px; margin-bottom: 9px; background: #11161d; }
      .debug-section[data-tone="warning"] { border-color: rgba(187,128,9,.6); }
      .debug-section[data-tone="danger"] { border-color: rgba(248,81,73,.65); }
      .debug-section[data-tone="success"] { border-color: rgba(46,160,67,.55); }
      .debug-section h2, .debug-section summary { margin: 0; padding: 9px 10px; color: #c9d1d9; font-size: 12px; font-weight: 700; letter-spacing: .02em; }
      .debug-section summary { cursor: pointer; user-select: none; }
      .debug-lines { border-top: 1px solid #21262d; padding: 8px 10px 10px; color: #9da7b3; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow-wrap: anywhere; }
      .debug-lines > div + div { margin-top: 3px; }
      .debug-controls { padding-bottom: 9px; }
      .debug-button-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 0 9px; }
      .debug-scenario-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 6px; }
      .debug-button { min-height: 32px; border: 1px solid #30363d; border-radius: 6px; padding: 5px 7px; background: #21262d; color: #c9d1d9; cursor: pointer; font-size: 11px; }
      .debug-layer-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 8px; padding: 0 10px 10px; }
      .debug-layer-toggle { display: flex; align-items: center; gap: 7px; min-width: 0; color: #9da7b3; font-size: 11px; }
      .debug-layer-toggle input { accent-color: #58a6ff; }
      .debug-hint { padding: 9px 10px; color: #6e7681; font: 10px/1.45 ui-monospace, monospace; }

      #debug-panel.is-collapsed .debug-heading,
      #debug-panel.is-collapsed .debug-badge,
      #debug-panel.is-collapsed .debug-panel-content { display: none; }
      #debug-panel.is-collapsed .debug-panel-header { grid-template-columns: 1fr; padding: 9px 6px; }
      #debug-panel.is-collapsed .debug-collapse { width: 30px; justify-self: center; }
      #debug-panel.is-owner-sandbox.is-collapsed { flex-basis: 92px; width: 92px; }
      #debug-panel.is-owner-sandbox.is-collapsed .debug-panel-header {
        grid-template-columns: 1fr 34px;
        gap: 4px;
        padding: 9px 6px;
      }
      #debug-panel.is-owner-sandbox,
      #debug-panel.is-owner-sandbox.is-collapsed {
        flex-basis: 132px;
        width: 132px;
      }
      #debug-panel.is-owner-sandbox .debug-panel-header,
      #debug-panel.is-owner-sandbox .debug-panel-content {
        display: none;
      }
      #debug-panel.is-owner-sandbox .owner-review-controls {
        display: flex;
        height: 100%;
        flex-direction: column;
        gap: 10px;
        padding: 14px 10px;
        background: #0d1117;
        border-left: 1px solid #30363d;
      }
      .owner-review-title {
        font-size: 12px;
        line-height: 1.2;
        color: #e7e9ee;
      }
      .owner-review-hint {
        color: #8b949e;
        font: 10px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .owner-review-scenarios,
      .owner-review-actions {
        display: grid;
        grid-template-columns: 1fr;
        gap: 6px;
      }
      .owner-review-actions {
        margin-top: auto;
      }
      #debug-panel.is-owner-sandbox .owner-review-controls .debug-button {
        width: 100%;
        min-height: 34px;
      }

      #debug-panel.is-teammate-sandbox,
      #debug-panel.is-teammate-sandbox.is-collapsed {
        flex-basis: 220px;
        width: 220px;
      }
      #debug-panel.is-teammate-sandbox .debug-panel-header,
      #debug-panel.is-teammate-sandbox .debug-panel-content {
        display: none;
      }
      #debug-panel.is-teammate-sandbox .owner-review-controls {
        display: flex;
        height: 100%;
        flex-direction: column;
        gap: 12px;
        padding: 16px 12px;
        background: #0d1117;
        border-left: 1px solid #30363d;
      }
      #debug-panel.is-teammate-sandbox .owner-review-controls .debug-button {
        width: 100%;
        min-height: 38px;
      }
      @media (max-width: 980px) {
        #debug-panel { flex-basis: min(46vw, 460px); width: min(46vw, 460px); }
      }
    </style>
  </head>
  <body>
    <div id="lab-shell">
      <main id="game-pane" aria-label="Companion Brain Lab world">
        <div id="game-root"></div>
      </main>
      <aside id="debug-panel" aria-label="Causal debug workbench"></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
